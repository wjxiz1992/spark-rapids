name: Shim cache experiment

on:
  push:
    branches: ['codex/shim-cache-poc-20261022-*']

permissions:
  contents: read
  actions: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Read experiment role
        id: role
        run: |
          python3 - <<'PY'
          import json, os
          with open('build/shim_cache_poc_run.json') as stream:
              mode = json.load(stream)['mode']
          assert mode in ('producer', 'consumer')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write(f'mode={mode}\n')
          PY
      - name: Measure static checks and artifact transport
        id: experiment
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.role.outputs.mode }}
        run: python3 build/shim_cache_poc.py --mode "$MODE" --output-dir "$RUNNER_TEMP/shim-cache-poc"
      - uses: actions/upload-artifact@v7
        if: steps.role.outputs.mode == 'producer'
        with:
          name: ${{ steps.experiment.outputs.artifact_16404 }}
          path: ${{ runner.temp }}/shim-cache-poc/cache/16404/pair-cache.json
          retention-days: 3
      - uses: actions/upload-artifact@v7
        if: steps.role.outputs.mode == 'producer'
        with:
          name: ${{ steps.experiment.outputs.artifact_15390 }}
          path: ${{ runner.temp }}/shim-cache-poc/cache/15390/pair-cache.json
          retention-days: 3
      - uses: actions/upload-artifact@v7
        if: steps.role.outputs.mode == 'producer'
        with:
          name: ${{ steps.experiment.outputs.artifact_14371 }}
          path: ${{ runner.temp }}/shim-cache-poc/cache/14371/pair-cache.json
          retention-days: 3
      - name: Keep experiment evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shim-cache-poc-measurement-${{ github.sha }}
          path: ${{ runner.temp }}/shim-cache-poc/measurement.json
          retention-days: 7
